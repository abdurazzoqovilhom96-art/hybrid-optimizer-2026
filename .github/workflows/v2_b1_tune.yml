name: ACE-SHADE B1 sozlash

# Ishga tushirish: .github/RUN_B1 ni yangilab push qilish.
on:
  push:
    paths: ['.github/RUN_B1']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tune:
    name: ${{ matrix.cfg }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        cfg: ["rn4_eta0.1", "rn4_eta0.2", "rn4_eta0.4", "rn6_eta0.1", "rn6_eta0.2", "rn6_eta0.4", "rn8_eta0.1", "rn8_eta0.2", "rn8_eta0.4", "rn10_eta0.1", "rn10_eta0.2", "rn10_eta0.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet -r requirements.txt
      - name: Konfiguratsiyani sozlash
        env:
          CFG: ${{ matrix.cfg }}
          OUT_DIR: tune
          RUNS: '10'
        run: python3 tune_b1.py
      - uses: actions/upload-artifact@v4
        with:
          name: tune-${{ matrix.cfg }}
          path: tune/
          retention-days: 30

  collect:
    name: Sozlash natijalarini yig'ish
    needs: tune
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {pattern: 'tune-*', path: tunes}
      - name: Birlashtirish va ranklash
        run: |
          DIRS=$(ls -d tunes/tune-* | paste -sd, -)
          MERGE="$DIRS" OUT_DIR=results/tuning_v2 python3 tune_b1.py
      - name: Natijani jurnalga chop etish
        run: |
          echo "===== ranklar ====="; cat results/tuning_v2/tuning_ranks.csv
          echo; echo "===== o'lcham bo'yicha ====="; cat results/tuning_v2/tuning_ranks_per_dim.csv
      - uses: actions/upload-artifact@v4
        with: {name: b1-tuning, path: results/tuning_v2/, retention-days: 90}
      - name: Natijalarni branchga yozish
        env:
          TARGET: claude/youthful-pascal-sjxqnn
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/tuning_v2
          if git diff --cached --quiet; then echo "o'zgarish yo'q"; else
            git commit -m "Add B1 tuning results from run ${{ github.run_number }}"
            git pull --rebase origin "$TARGET"
            git push origin HEAD:"$TARGET"
          fi
