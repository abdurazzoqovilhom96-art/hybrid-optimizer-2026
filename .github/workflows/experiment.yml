name: CBA-SHADE full experiment

# workflow_dispatch faqat fayl default branchda (main) bo'lsagina ishlaydi,
# ish esa feature branchda. Shuning uchun ishga tushirishning ikki yo'li bor:
#   1) marker faylni yangilab push qilish:
#        date -u > .github/RUN_EXPERIMENT && git commit -am "run" && git push
#   2) teg qo'yish:  git tag run-experiment-1 && git push origin run-experiment-1
# Branch main ga birlashtirilgandan keyin Actions sahifasidagi "Run workflow"
# tugmasi ham ishlaydi.
on:
  push:
    branches: ["claude/**"]
    paths: [".github/RUN_EXPERIMENT"]
    tags:
      - "run-experiment*"
  workflow_dispatch:
    inputs:
      runs:
        description: "Independent runs per instance"
        default: "30"
      include_classic:
        description: "Also run the metaphor-based baselines (1 = yes)"
        default: "0"

permissions:
  contents: write

jobs:
  chunk:
    name: ${{ matrix.dim }}D
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        dim: [30, 50, 100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet numpy pandas scipy joblib matplotlib
      - name: Run ${{ matrix.dim }}D chunk
        env:
          DIMS: ${{ matrix.dim }}
          RUNS: ${{ inputs.runs || '30' }}
          INCLUDE_CLASSIC: ${{ inputs.include_classic || '0' }}
          OUT_DIR: chunk
        run: python cba_shade.py
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.dim }}
          path: chunk/
          retention-days: 30

  analyse:
    name: Merge and analyse
    needs: chunk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet numpy pandas scipy joblib matplotlib
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: chunks
      - name: Merge every chunk into one analysis
        env:
          ANALYZE_ONLY: "1"
          MERGE: chunks/chunk-30,chunks/chunk-50,chunks/chunk-100
          OUT_DIR: results/full
        run: python cba_shade.py
      - name: Computational complexity (T0/T1/T2)
        env:
          COMPLEXITY: "1"
          QUICK: "1"
          RUNS: "1"
          OUT_DIR: results/complexity
        run: python cba_shade.py
      # Commit-back muvaffaqiyatsiz bo'lsa ham asosiy jadvallar jurnaldan
      # o'qilishi uchun ularni bu yerda chop etamiz (zaxira kanal).
      - name: Print the key tables into the job log
        run: |
          for f in overall_average_ranks.csv friedman_posthoc.csv win_tie_loss.csv; do
            echo "===== $f ====="; cat "results/full/tables/$f"; echo
          done
          echo "===== friedman_test.txt ====="; cat results/full/tables/friedman_test.txt; echo
          echo "===== summary_results.csv ====="; cat results/full/tables/summary_results.csv
      - uses: actions/upload-artifact@v4
        with:
          name: full-analysis
          path: results/
          retention-days: 90
      - name: Commit the results back to the branch
        env:
          TARGET: claude/youthful-pascal-sjxqnn
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/
          if git diff --cached --quiet; then
            echo "Natijalarda o'zgarish yo'q"
          else
            git commit -m "Add full experiment results from workflow run ${{ github.run_number }}"
            git pull --rebase origin "$TARGET"
            git push origin HEAD:"$TARGET"
          fi
